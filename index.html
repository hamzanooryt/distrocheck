<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>distrocheck // System Evaluation</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --term-bg: #161b22;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --prompt-color: #7ee787;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal {
            background-color: var(--term-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            width: 100%;
            max-width: 680px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .terminal-header {
            background-color: #21262d;
            padding: 12px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .buttons {
            display: flex;
            gap: 6px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .close { background-color: #f85149; }
        .minimize { background-color: #f0883e; }
        .maximize { background-color: #56d364; }

        .title {
            margin-left: 20px;
            font-size: 13px;
            color: #8b949e;
            font-weight: bold;
        }

        .content {
            padding: 30px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin-top: 0;
            letter-spacing: 1px;
        }

        .prompt {
            color: var(--prompt-color);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-block {
            margin-bottom: 25px;
            background: rgba(255,255,255,0.01);
            padding: 18px;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }

        .question-block p {
            margin-top: 0;
            font-weight: bold;
            color: #fff;
        }

        .options label {
            display: block;
            margin: 10px 0;
            cursor: pointer;
            font-size: 14px;
        }

        input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--accent-color);
        }
