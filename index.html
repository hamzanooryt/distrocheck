<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>distrocheck // System Evaluation</title>
  <style>
    /* --- Navy Blue & Beige Theme Variables --- */
    :root {
      --bg-color: #0a1128;       /* Deep Navy Blue */
      --sidebar-bg: #1c2541;     /* Classic Navy Blue */
      --term-bg: #111c3a;        /* Dark Navy for Quiz Window */
      --text-main: #f4f5f6;      /* Off-white Text */
      --text-muted: #94a3b8;     /* Muted Blue-Grey Text */
      --accent-beige: #e0d0b8;   /* Warm Beige Accent Color */
      --sidebar-width: 280px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Hamburger Button (Hidden on Desktop) --- */
    .menu-toggle {
      display: none;
    }

    /* --- Sidebar Setup --- */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--sidebar-bg);
      border-right: 1px solid #2a3454;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand-section {
      margin-bottom: 32px;
      padding-left: 8px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-beige); /* Beige Title */
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item a {
      display: block;
      padding: 12px 16px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .nav-item a:hover {
      background-color: #2a3454;
      color: var(--text-main);
    }

    .nav-item.active a {
      background-color: #2a3454;
      color: var(--accent-beige); /* Active text highlighted in Beige */
      border-left: 3px solid var(--accent-beige);
      font-weight: 600;
    }

    /* --- Main Screen Layout --- */
    .main-content {
      flex-grow: 1;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: calc(100% - var(--sidebar-width));
    }

    /* --- Terminal Quiz Window --- */
    .terminal-window {
      width: 100%;
      max-width: 650px;
      background-color: var(--term-bg);
      border-radius: 8px;
      border: 1px solid #2a3454;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .terminal-header {
      background-color: #070d1f;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      position: relative;
      border-bottom: 1px solid #2a3454;
    }

    .terminal-buttons {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-red { background-color: #ef4444; }
    .dot-yellow { background-color: #eab308; }
    .dot-green { background-color: #22c55e; }

    .terminal-title {
      position: absolute;
      width: 100%;
      text-align: center;
      left: 0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .terminal-body {
      padding: 24px;
      font-family: 'Courier New', Courier, monospace;
    }

    .app-title {
      font-size: 1.4rem;
      color: var(--accent-beige);
      font-weight: bold;
      margin-bottom: 16px;
    }

    .terminal-prompt {
      color: var(--accent-beige);
      margin-bottom: 24px;
    }
    .terminal-prompt span {
      color: var(--text-main);
    }

    .quiz-question {
      font-size: 1rem;
      color: var(--text-main);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #1c2541;
      border: 1px solid #2a3454;
      color: var(--text-main);
      padding: 14px 16px;
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      width: 100%;
    }

    .option-btn:hover {
      background-color: #2a3454;
      border-color: var(--accent-beige);
      color: var(--accent-beige);
    }

    .result-title {
      font-size: 1.2rem;
      color: var(--accent-beige);
      margin-bottom: 12px;
      font-weight: bold;
    }

    /* --- Responsive Rules for Mobile (Show / Hide Trigger) --- */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      /* Make Hamburger Button Visible on Mobile Screens */
      .menu-toggle {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: fixed;
        top: 20px;
        left: 20px;
        width: 28px;
        height: 20px;
        background: transparent;
        border: none;
        cursor: pointer;
        z-index: 1000;
      }

      .menu-toggle span {
        display: block;
        height: 3px;
        width: 100%;
        background-color: var(--accent-beige); /* Beige Hamburger Lines */
        border-radius: 2px;
        transition: all 0.3s ease;
      }

      /* Sidebar turns into a slide-out drawer container */
      .sidebar {
        position: fixed;
        top: 0;
        left: -280px; /* Kept completely off-screen until clicked */
        height: 100vh;
        z-index: 999;
        transition: left 0.3s ease-in-out;
        box-shadow: 10px 0 25px rgba(0, 0, 0, 0.6);
      }

      /* Slid into view when active class is added */
      .sidebar.active {
        left: 0;
      }

      .main-content {
        width: 100%;
        padding: 80px 16px 40px 16px;
      }

      /* Morph hamburger icon into an X when open */
      .menu-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
      .menu-toggle.open span:nth-child(2) { opacity: 0; }
      .menu-toggle.open span:nth-child(3) { transform: translateY(-4px) rotate(-45deg); }
    }
  </style>
</head>
<body>

  <button class="menu-toggle" id="mobileMenuBtn" aria-label="Toggle Navigation Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <aside class="sidebar" id="navigationSidebar">
    <div class="brand-section">
      <h1 class="brand-title">Linux Codex</h1>
      <p class="brand-subtitle">From Absolute Zero to Sysadmin</p>
    </div>
    <nav>
      <ul class="nav-list">
        <li class="nav-item"><a href="#">1. Core Overview</a></li>
        <li class="nav-item"><a href="#">2. Distribution Matrix</a></li>
        <li class="nav-item"><a href="#">3. Directory Hierarchy</a></li>
        <li class="nav-item"><a href="#">4. Command Sandbox</a></li>
        <li class="nav-item"><a href="#">5. Package & Security</a></li>
        <li class="nav-item"><a href="#">6. Arch Installation</a></li>
        <li class="nav-item"><a href="#">7. Learning Roadmap</a></li>
        <li class="nav-item active"><a href="#">8. Knowledge Evaluation</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-content" id="contentArea">
    <section class="terminal-window">
      <div class="terminal-header">
        <div class="terminal-buttons">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="terminal-title">bash - distrocheck</div>
      </div>

      <div class="terminal-body" id="quiz-body">
        </div>
    </section>
  </main>

  <script>
    /* --- Your Normal, Unbroken Dynamic Quiz Engine --- */
    const questions = [
      {
        question: "1. What is your preferred package management styling?",
        options: [
          { text: "DIY / Building everything from scratch", points: { gentoo: 3, arch: 1 } },
          { text: "Bleeding edge updates, keep it minimal", points: { arch: 3, fedora: 1 } },
          { text: "Rock solid stability, things should just work", points: { mint: 3, fedora: 2 } }
        ]
      },
      {
        question: "2. How do you feel about system configuration file management?",
        options: [
          { text: "I want manual control over every single config row", points: { gentoo: 2, arch: 3 } },
          { text: "Sane defaults out of the box, but fully customizable", points: { fedora: 3, mint: 1 } },
          { text: "Graphical control panels all the way", points: { mint: 3 } }
        ]
      }
    ];

    let currentQuestion = 0;
    let scores = { arch: 0, fedora: 0, mint: 0, gentoo: 0 };

    function loadQuestion() {
      const qBody = document.getElementById('quiz-body');

      if (currentQuestion >= questions.length) {
        showResults();
        return;
      }

      const q = questions[currentQuestion];
      let html = `
        <div class="app-title">distrocheck v1.0.0</div>
        <div class="terminal-prompt">arteo@system:~ $ <span>./run_evaluation.sh</span></div>
        <div class="quiz-question">${q.question}</div>
        <div class="options-container">
      `;

      q.options.forEach((opt, idx) => {
        html += `<button class="option-btn" onclick="selectOption(${idx})">&gt; ${opt.text}</button>`;
      });

      html += `</div>`;
      qBody.innerHTML = html;
    }

    function selectOption(index) {
      const points = questions[currentQuestion].options[index].points;
      for (let distro in points) {
        scores[distro] += points[distro];
      }
      currentQuestion++;
      loadQuestion();
    }

    function showResults() {
      const qBody = document.getElementById('quiz-body');
      let winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);

      let descriptions = {
        arch: "Arch Linux. You appreciate micro-optimization, bleeding-edge kernels, and custom environment configuration.",
        fedora: "Fedora Workstation. Clean, leading-edge features, stable, and highly trusted for efficient development workflows.",
        mint: "Linux Mint. Elegant, classic desktop familiarity, dependable, and zero configuration friction.",
        gentoo: "Gentoo Linux. Ultimate machine control. You compile from source and dictate exact compiler configurations."
      };

      qBody.innerHTML = `
        <div class="result-title">[EVALUATION COMPLETE]</div>
        <p>Your ultimate matching ecosystem profile is:</p>
        <h2 style="color: var(--accent-beige); font-size: 28px; margin: 15px 0;">&gt; ${winner.toUpperCase()}</h2>
        <p style="line-height: 1.6; color: var(--text-muted);">${descriptions[winner]}</p>
        <button class="option-btn" style="margin-top: 20px;" onclick="resetQuiz()">Execute New Diagnostic Run</button>
      `;
    }

    function resetQuiz() {
      currentQuestion = 0;
      scores = { arch: 0, fedora: 0, mint: 0, gentoo: 0 };
      loadQuestion();
    }

    /* --- Show/Hide Sidebar Script Mechanics --- */
    document.addEventListener('DOMContentLoaded', () => {
      loadQuestion(); // Fire up quiz rendering instantly

      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const navigationSidebar = document.getElementById('navigationSidebar');
      const contentArea = document.getElementById('contentArea');

      // Toggles the visibility when button is pressed
      mobileMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        navigationSidebar.classList.toggle('active');
        mobileMenuBtn.classList.toggle('open');
      });

      // Clicking main background automatically closes the menu drawer
      contentArea.addEventListener('click', () => {
        if (navigationSidebar.classList.contains('active')) {
          navigationSidebar.classList.remove('active');
          mobileMenuBtn.classList.remove('open');
        }
      });
    });
  </script>
</body>
</html>
