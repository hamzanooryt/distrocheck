<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>distrocheck // System Evaluation</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --term-bg: #161b22;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --prompt-color: #7ee787;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .terminal {
            background-color: var(--term-bg);
            border: 1px solid #30363d;
            border-radius: 6px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .terminal-header {
            background-color: #21262d;
            padding: 12px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        .buttons {
            display: flex;
            gap: 6px;
        }
        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .close { background-color: #f85149; }
        .minimize { background-color: #f0883e; }
        .maximize { background-color: #56d364; }
        .title {
            margin-left: 20px;
            font-size: 13px;
            color: #8b949e;
            font-weight: bold;
        }
        .content {
            padding: 30px;
        }
        h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin-top: 0;
            letter-spacing: 1px;
        }
        .prompt {
            color: var(--prompt-color);
            margin-bottom: 20px;
            font-weight: bold;
        }
        .question-block {
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: var(--text-color);
            padding: 12px 18px;
            text-align: left;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #fff;
        }
        .result-title {
            color: var(--prompt-color);
            font-size: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="terminal-header">
        <div class="buttons">
            <div class="btn close"></div>
            <div class="btn minimize"></div>
            <div class="btn maximize"></div>
        </div>
        <div class="title">bash - distrocheck</div>
    </div>
    <div class="content" id="quiz-container">
        <h1>distrocheck v1.0.0</h1>
        <div class="prompt">arteo@system:~ $ ./run_evaluation.sh</div>

        <div id="quiz-body">
            </div>
    </div>
</div>

<script>
    const questions = [
        {
            text: "1. What is your preferred package management styling?",
            options: [
                { text: "DIY / Building everything from scratch", points: { arch: 3, gentoo: 5, fedora: 0, mint: 0 } },
                { text: "Bleeding edge updates, keep it minimal", points: { arch: 5, fedora: 2, gentoo: 2, mint: 0 } },
                { text: "Rock solid stability, things should just work", points: { mint: 5, fedora: 4, arch: 0, gentoo: 0 } }
            ]
        },
        {
            text: "2. How do you feel about pre-configured graphical user interfaces?",
            options: [
                { text: "Give me a beautiful, familiar desktop layout out of the box", points: { mint: 5, fedora: 3, arch: 0, gentoo: 0 } },
                { text: "I want to script my own window manager tiling behavior", points: { arch: 5, gentoo: 4, fedora: 1, mint: 0 } }
            ]
        },
        {
            text: "3. What is your primary system stance?",
            options: [
                { text: "Total control over compilation flags and performance tweaks", points: { gentoo: 5, arch: 3, fedora: 0, mint: 0 } },
                { text: "A balanced, clean workstation framework", points: { fedora: 5, mint: 3, arch: 2, gentoo: 0 } }
            ]
        }
    ];

    let currentQuestion = 0;
    let scores = { arch: 0, fedora: 0, mint: 0, gentoo: 0 };

    function loadQuestion() {
        const qBody = document.getElementById('quiz-body');
        if (currentQuestion >= questions.length) {
            showResults();
            return;
        }

        const q = questions[currentQuestion];
        let html = `<div class="question-block">${q.text}</div><div class="options">`;

        q.options.forEach((opt, idx) => {
            html += `<button class="option-btn" onclick="selectOption(${idx})">> ${opt.text}</button>`;
        });

        html += `</div>`;
        qBody.innerHTML = html;
    }

    function selectOption(index) {
        const points = questions[currentQuestion].options[index].points;
        for (let distro in points) {
            scores[distro] += points[distro];
        }
        currentQuestion++;
        loadQuestion();
    }

    function showResults() {
        const qBody = document.getElementById('quiz-body');
        let winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);

        let descriptions = {
            arch: "Arch Linux. You appreciate micro-optimization, bleeding-edge kernels, and custom environment configuration.",
            fedora: "Fedora Workstation. Clean, leading-edge features, stable, and highly trusted for efficient development workflows.",
            mint: "Linux Mint. Elegant, classic desktop familiarity, dependable, and zero configuration friction.",
            gentoo: "Gentoo Linux. Ultimate machine control. You compile from source and dictate exact compiler configurations."
        };

        qBody.innerHTML = `
            <div class="result-title">[EVALUATION COMPLETE]</div>
            <p>Your ultimate matching ecosystem profile is:</p>
            <h2 style="color: var(--accent-color); font-size: 28px; margin: 15px 0;">=> ${winner.toUpperCase()}</h2>
            <p style="line-height: 1.6; color: #8b949e;">${descriptions[winner]}</p>
            <button class="option-btn" style="margin-top: 20px;" onclick="resetQuiz()">Execute New Diagnostic Run</button>
        `;
    }

    function resetQuiz() {
        currentQuestion = 0;
        scores = { arch: 0, fedora: 0, mint: 0, gentoo: 0 };
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
