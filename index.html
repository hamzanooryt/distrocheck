<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Beginner's Linux Codex</title>
    <style>
        :root {
            /* Light/Beige Mode Palette */
            --bg-primary: #fdfbf7;
            --bg-secondary: #f4efe2;
            --sidebar-bg: #0f172a;
            --sidebar-text: #f4efe2;
            --sidebar-active: #ebdcb9;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --accent: #1e3a8a;
            --accent-light: #3b82f6;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
            --code-bg: #1e293b;
            --code-text: #f8fafc;
            --prompt-color: #10b981;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        [data-theme="dark"] {
            /* Dark/Navy Mode Palette */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --sidebar-bg: #020617;
            --sidebar-text: #94a3b8;
            --sidebar-active: #fdfbf7;
            --text-primary: #fdfbf7;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --border-color: #334155;
            --card-bg: #1e293b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Fixed Sidebar Layout */
        nav {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 100;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .logo-area h2 {
            color: #ffffff;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 0.5rem;
        }

        .logo-area p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .nav-links li a {
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 0.75rem 1rem;
            display: block;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-links li a:hover, .nav-links li.active a {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--sidebar-active);
        }

        .nav-links li.active a {
            border-left: 4px solid var(--sidebar-active);
            font-weight: bold;
        }

        .theme-control {
            padding-top: 1rem;
            border-top: 1px solid #334155;
        }

        .theme-btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            background-color: var(--accent);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .theme-btn:hover {
            opacity: 0.9;
        }

        /* Main Content Frame with Dot-Grid Background Canvas */
        main {
            margin-left: 280px;
            flex-grow: 1;
            padding: 3rem 4rem;
            max-width: 1200px;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px) !important;
            background-size: 26px 26px !important;
            position: relative;
            overflow: hidden;
        }

        .page-section {
            display: none;
            position: relative;
            min-height: 75vh;
        }

        .page-section.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        /* Structural config for dynamic background text watermarks */
        .page-section::after {
            position: fixed;
            bottom: 3rem;
            right: 4rem;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-weight: 900;
            line-height: 1.1;
            color: var(--text-primary);
            opacity: 0.025; /* High-end ultra-faint watermark depth rule */
            pointer-events: none;
            user-select: none;
            z-index: 1;
            white-space: pre;
            transition: opacity 0.3s ease;
        }

        #overview::after { content: "$ cd ~"; font-size: 12rem; }
